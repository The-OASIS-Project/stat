# OASIS STAT Configuration
# This file is sourced by the systemd service

# MQTT Settings
MQTT_HOST=localhost
MQTT_PORT=1883
MQTT_TOPIC=stat/telemetry

# MQTT Authentication (leave empty to disable)
#MQTT_USERNAME=oasis
#MQTT_PASSWORD=your-password

# MQTT TLS (set to 1 or true to enable)
#MQTT_TLS=false
#MQTT_CA_CERT=/etc/mosquitto/certs/ca.crt

# Battery Configuration
# Select a predefined battery pack profile by name. Run
# 'oasis-stat --list-batteries' to see all available types.
# A --battery flag on the command line overrides this value; an unset or
# unknown value falls back to the built-in default (4S2P_Samsung50E).
BATTERY_TYPE=4S2P_Samsung50E

# Network Monitoring
# Publishes interface/IP/route/reachability telemetry as a "Network" message.
# On by default (hardware-free). Set NET_ENABLE=false to disable entirely.
#NET_ENABLE=true
# Poll cadence in ms (clamped to 1000-60000). Network state changes slowly.
#NET_INTERVAL_MS=5000
# Gateway reachability probe (unprivileged ICMP echo). Set false to skip probing.
#NET_PROBE=true
# Shared probe deadline in ms (clamped to 50-5000); worst-case loop jitter.
#NET_PROBE_TIMEOUT_MS=500

